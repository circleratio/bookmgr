{{define "content"}}
{{$values := .Values}}
<h1>{{if .IsNew}}新規登録{{else}}編集{{end}}</h1>

{{if .Error}}<p class="error">{{.Error}}</p>{{end}}

<form action="{{if .IsNew}}/books{{else}}/books/{{.ID}}{{end}}" method="post" class="card book-form">
  <label for="isbn">ISBN</label>
  <div class="isbn-row">
    <input type="text" id="isbn" name="isbn" placeholder="978-4-10-101035-9"
           value="{{if $values}}{{strVal $values.ISBN}}{{end}}">
    {{if .IsNew}}<button type="button" id="isbn-lookup-button">取得</button>{{end}}
  </div>
  {{if .IsNew}}<p id="isbn-lookup-message" class="lookup-message"></p>{{end}}

  <label for="title">書名 *</label>
  <input type="text" id="title" name="title" maxlength="255" required
         value="{{if $values}}{{$values.Title}}{{end}}">

  <label for="author">著者 *</label>
  <input type="text" id="author" name="author" maxlength="255" required
         value="{{if $values}}{{$values.Author}}{{end}}">

  <label for="rating">評価</label>
  <select id="rating" name="rating">
    <option value="">未評価</option>
    {{$currentRating := ""}}{{if $values}}{{$currentRating = intVal $values.Rating}}{{end}}
    {{range $n := ratings}}
    <option value="{{$n}}" {{if eq (printf "%d" $n) $currentRating}}selected{{end}}>{{$n}}</option>
    {{end}}
  </select>

  <label for="publisher">出版社</label>
  <input type="text" id="publisher" name="publisher" maxlength="255"
         value="{{if $values}}{{strVal $values.Publisher}}{{end}}">

  <label for="published_date">出版日</label>
  <input type="date" id="published_date" name="published_date"
         value="{{if $values}}{{strVal $values.PublishedDate}}{{end}}">

  <label for="memo">メモ</label>
  <textarea id="memo" name="memo" maxlength="2000" rows="4">{{if $values}}{{strVal $values.Memo}}{{end}}</textarea>

  <div class="form-actions">
    <button type="submit">保存</button>
    <a href="/">キャンセル</a>
  </div>
</form>

{{if .IsNew}}
<script>
document.getElementById('isbn-lookup-button').addEventListener('click', async function () {
  var isbn = document.getElementById('isbn').value.trim();
  var msg = document.getElementById('isbn-lookup-message');
  if (!isbn) {
    msg.textContent = 'ISBNを入力してください';
    return;
  }
  msg.textContent = '取得中...';
  try {
    var res = await fetch('/books/isbn-lookup?isbn=' + encodeURIComponent(isbn));
    var body = await res.json();
    if (!res.ok) {
      msg.textContent = body.error || '取得に失敗しました';
      return;
    }
    var data = body.data;
    if (data.title) document.getElementById('title').value = data.title;
    if (data.author) document.getElementById('author').value = data.author;
    if (data.publisher) document.getElementById('publisher').value = data.publisher;
    if (data.published_date) document.getElementById('published_date').value = data.published_date;
    if (data.isbn) document.getElementById('isbn').value = data.isbn;
    msg.textContent = '取得しました';
  } catch (e) {
    msg.textContent = '取得に失敗しました';
  }
});
</script>
{{end}}
{{end}}
